<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOKER CONTROL</title><style>
body{background:#09090d;color:#eee;font:16px system-ui;margin:35px auto;max-width:900px;padding:20px}h1{color:#ff4fa3;letter-spacing:3px}section{border:1px solid #58324a;border-radius:12px;padding:18px;margin-top:25px}input,button{padding:12px;background:#171720;color:white;border:1px solid #a34c7b;border-radius:8px}button{cursor:pointer;color:#ff8bc0}table{width:100%;margin-top:18px;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #333}th{color:#ff8bc0}.online{color:#62e6a2}.offline{color:#ff7777}</style><body><h1>TOKER CONTROL</h1><p>Панель статуса подключённых устройств</p><section><input id="token" type="password" placeholder="ADMIN_TOKEN"><button onclick="load()">Открыть / обновить</button><p id="msg">Введите административный токен.</p><table><thead><tr><th>Устройство</th><th>Платформа</th><th>Статус</th><th>Последняя связь</th></tr></thead><tbody id="rows"></tbody></table></section><p>Клиент подключается только после явного действия владельца.</p><script>
async function load(){let t=document.getElementById('token').value,m=document.getElementById('msg'),b=document.getElementById('rows');try{let r=await fetch('/api/devices',{headers:{'X-Admin-Token':t}});if(!r.ok)throw Error(r.status===401?'Неверный токен':'Ошибка '+r.status);let a=await r.json();b.innerHTML='';a.forEach(d=>{let tr=document.createElement('tr');[d.name,d.platform,d.status,new Date(d.last_seen*1000).toLocaleString()].forEach(v=>{let td=document.createElement('td');td.textContent=v;if(v==='online'||v==='offline')td.className=v;tr.appendChild(td)});b.appendChild(tr)});m.textContent=a.length?'Устройств: '+a.length:'Пока нет устройств'}catch(e){b.innerHTML='';m.textContent=e.message}}</script></body></html>
